<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link rel="stylesheet" href="realme.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<section class="checkout">

    <div class="container">

        <div class="checkout-card">

            <div class="left">

                <img src="realme.jpg" alt="">

                <h2>Samsung</h2>

                <h3>1000$</h3>

            </div>

            <div class="right">

                <h2>Complete Your Order</h2>

                <form>

                    <input type="text" placeholder="Full Name">

                    <input type="email" placeholder="Email Address">

                    <input type="number" placeholder="Phone Number">

                    <textarea placeholder="Delivery Address"></textarea>

                    <select>
                        <option>Cash On Delivery</option>
                        <option>bKash</option>
                        <option>Nagad</option>
                    </select>

                    <button>
                        Confirm Order
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

</body>
</html>
